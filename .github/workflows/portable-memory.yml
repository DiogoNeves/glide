name: Portable memory checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools>=68' wheel
      - name: Runtime and synthetic source-adapter regressions
        run: python -m unittest discover -s runtime/tests -v
        env:
          PYTHONPATH: runtime
      - name: Synthetic model-screen wrapper regressions
        run: python -m unittest discover -s examples/model-screen -p 'test_*.py' -v
      - name: Conversation inventory metadata and recovery hints
        run: python -m unittest discover -s tests -p test_conversation_inventory.py -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Content pin and clean default installation
        run: python runtime/check_package.py
      - name: Build and exercise installed wheel assets
        run: python runtime/check_wheel.py
      - name: Whitespace errors
        run: git diff --check
