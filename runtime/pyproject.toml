[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glide-memory"
version = "0.1.0"
description = "Readable versioned memory with a rebuildable local SQLite index"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
glide-memory = "glide_memory.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["glide_memory*"]

[tool.setuptools.package-data]
glide_memory = ["review.html"]
